# flows/design-to-report.flow.yml
#
# Nửa sau của pipeline: thiết kế test case → sinh code + spec → kiểm chứng → báo cáo.
# Tiếp tục phiên do luồng `leader-analyst` mở; luồng này KHÔNG tự mở phiên, vì một phiên
# chưa có deliverable của qa-analyst thì không có gì để thiết kế test case từ đó.
#
# File này THAY THẾ phần điều phối viết cứng trong workflow/flow-3-*.js. Script đó giờ chỉ
# còn là shim gọi flow-runner với đúng file này — một đường code, không phải hai.

name: design-to-report
title: Thiết kế → tự động hoá → kiểm chứng → báo cáo
description: >-
  Bốn node cuối. Có ba điểm dừng để giao lại cho người, đều là CHỦ Ý chứ không phải thiếu sót.
requires_run: true

flags:
  - name: confirm-mcp
    note: cho phép qa-automation gọi MCP Playwright THẬT (mở trình duyệt tới base_url)
  - name: vlm-all
    note: soi ảnh MỌI test case, không chỉ test fail + test pass High/Critical
  - name: no-gate
    note: bỏ cửa duyệt người giữa các node — chỉ dùng khi demo nhanh

params:
  - name: report-types
    kind: list
    default: daily,narrative
    note: >-
      KHÔNG mặc định sinh "bug". Verdict ASK nghĩa là người phải đọc deliverable-verifier.md
      và tự xác định cái nào là bug thật; luồng không đoán thay.

steps:

  # ── 1. Thiết kế test case — thuần LLM, không ra ngoài ──────────────────
  - node: qa-test-designer
    label: Thiết kế test case
    # Phải có deliverable của analyst ĐÃ ĐƯỢC DUYỆT. Thiết kế test case trên một bản phân
    # tích chưa ai đọc là nhân cái sai lên 21 lần.
    require_step: qa-analyst
    gate: qa-analyst

  # ── 2. Sinh code dùng lại + spec — GỌI MCP PLAYWRIGHT THẬT ─────────────
  - node: qa-automation
    label: Explore UI + sinh Page Object, step library, spec
    # Cửa duyệt đặt TRƯỚC --confirm-mcp: mở trình duyệt thật lên site thật dựa trên một bảng
    # test case chưa ai đọc là cái sai đắt nhất ở đây.
    gate: qa-test-designer
    confirm_flag: confirm-mcp
    confirm_reason: >-
      mở trình duyệt THẬT tới base_url (tầng 2) để explore DOM và để Playwright sinh locator
    # Chạy lại sau verdict FIX: test-results.json cũ được đo trên spec CŨ. Giữ lại là đem
    # kết quả của một phiên bản spec đi kiểm chứng một phiên bản spec khác.
    delete_stale:
      - TEST_RESULTS

  # ── 3. Kiểm chứng ─────────────────────────────────────────────────────
  - node: qa-verifier
    label: Kiểm chứng kết quả chạy
    # Node này KHÔNG tự chạy .spec.ts — người/CI chạy. Xem agents/qa-verifier/role.md.
    wait_for_file: TEST_RESULTS
    wait_for_hint: npx playwright test --reporter=json
    # Spec sinh ra test-results.json phải được người đọc trước khi kết quả của nó biến thành
    # "bug", nếu không thì một spec sai âm thầm trở thành lỗi sản phẩm.
    gate: qa-automation
    with:
      vlmAll: $flag.vlm-all
    branch_on: verdict
    branch:
      - value: PASS
        action: continue
      - value: ASK
        action: stop
        message: >-
          Verifier cần người xác nhận. Đọc deliverable-verifier.md — xác định các test
          BEHAVIOR_MISMATCH/UNCLEAR có phải bug thật không. Sau đó tự chạy qa-reporter với
          --report-types=bug; luồng này không đoán thay bạn.
      - value: FIX
        action: rework
        rework_node: qa-automation
        rework_note: "Verifier: SPEC_ISSUE — spec lỗi thời so với ui-conventions.md"
        message: >-
          Verdict FIX — spec đã lỗi thời so với UI thật, KHÔNG phải lỗi sản phẩm. Chạy lại
          đúng lệnh này (kèm --confirm-mcp) để qa-automation explore lại và sinh spec mới.

  # ── 4. Báo cáo ────────────────────────────────────────────────────────
  - node: qa-reporter
    label: Viết báo cáo
    # Báo cáo là thứ ra khỏi nhóm, nên verdict đằng sau nó là thứ cuối cùng cần người ký.
    # Bước này SẼ chặn ở lần chạy đầu — qa-verifier vừa được đánh done và chưa ai duyệt.
    # Đó là cửa duyệt đang làm việc, không phải lỗi.
    gate: qa-verifier
    with:
      reportTypes: $param.report-types

# Chạm tới đây là hết pipeline: đóng phiên để nó thành lịch sử, thay vì `active` mãi mãi và
# khiến lần chạy leader-analyst sau không mở được phiên mới.
finish: done
